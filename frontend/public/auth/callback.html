<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Callback</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" rel="stylesheet">
    <style>
        :root {
            --first-color: #007bff;
            --primary-color: #fff;
            --text-color: #333;
            --background-color: #f9fafb;
            --border-color: #d1d5db;
        }
        [data-theme="dark"] {
            --first-color: #66b0ff;
            --primary-color: #1f2937;
            --text-color: #f3f4f6;
            --background-color: #111827;
            --border-color: #6b7280;
        }
        body {
            font-family: 'Inter', Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to bottom, var(--background-color), var(--primary-color));
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--first-color);
            border-radius: 50%;
            width: 1.5rem;
            height: 1.5rem;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            color: #ef4444;
            text-align: center;
            margin-top: 1rem;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p class="error hidden" id="error-message"></p>
    <script src="/assets/js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const refreshToken = urlParams.get('refreshToken');
            const provider = urlParams.get('provider');
            const error = urlParams.get('error');

            // Apply saved theme
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);

            if (error) {
                console.error('Authentication error from URL:', decodeURIComponent(error));
                document.querySelector('.loader').classList.add('hidden');
                document.getElementById('error-message').textContent = decodeURIComponent(error);
                document.getElementById('error-message').classList.remove('hidden');
                Toastify({
                    text: `Authentication failed: ${decodeURIComponent(error)}`,
                    duration: 3000,
                    style: { background: '#ef4444' }
                }).showToast();
                setTimeout(() => window.location.href = `${window.ENV.WEB_URL}/login.html`, 3000);
                return;
            }

            if (token && provider) {
                localStorage.setItem('userToken', token);
                localStorage.setItem('refreshToken', refreshToken);
                try {
                    const response = await fetch(`${window.ENV.API_URL}/api/verify-token`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data.error || 'Token verification failed');
                    }
                    Toastify({
                        text: `Logged in with ${provider.charAt(0).toUpperCase() + provider.slice(1)}!`,
                        duration: 3000,
                        style: { background: '#10b981' }
                    }).showToast();
                    setTimeout(() => window.location.href = `${window.ENV.WEB_URL}/profile/me`, 1000);
                } catch (error) {
                    console.error('Error verifying token:', error.message);
                    document.querySelector('.loader').classList.add('hidden');
                    document.getElementById('error-message').textContent = `Authentication error: ${error.message}`;
                    document.getElementById('error-message').classList.remove('hidden');
                    Toastify({
                        text: `Authentication error: ${error.message}`,
                        duration: 3000,
                        style: { background: '#ef4444' }
                    }).showToast();
                    setTimeout(() => window.location.href = `${window.ENV.WEB_URL}/login.html`, 3000);
                }
            } else {
                console.error('No token or provider provided in URL');
                document.querySelector('.loader').classList.add('hidden');
                document.getElementById('error-message').textContent = 'Authentication failed: No token or provider provided';
                document.getElementById('error-message').classList.remove('hidden');
                Toastify({
                    text: 'Authentication failed: No token or provider provided',
                    duration: 3000,
                    style: { background: '#ef4444' }
                }).showToast();
                setTimeout(() => window.location.href = `${window.ENV.WEB_URL}/login.html`, 3000);
            }
        });
    </script>
</body>
</html>
