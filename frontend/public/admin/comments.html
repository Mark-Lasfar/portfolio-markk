<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al-Asfar Comments Management</title>
  <style>
    :root {
      --first-color: #007bff;
      --second-color: #333;
      --primary-color: #fff;
      --primary-color-2: #f4f4f4;
      --container-border: #ccc;
      --text-color: #333;
      --background-color: #fff;
    }

    [data-theme="dark"] {
      --first-color: #66b0ff;
      --second-color: #ccc;
      --primary-color: #1a1a1a;
      --primary-color-2: #2c2c2c;
      --container-border: #444;
      --text-color: #fff;
      --background-color: #121212;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: var(--background-color);
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--primary-color);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
    }

    .nav-links {
      margin: 20px 0;
      text-align: center;
    }

    .nav-links a {
      padding: 10px 20px;
      background: var(--first-color);
      color: #fff;
      border-radius: 5px;
      text-decoration: none;
      margin: 0 10px;
    }

    .nav-links a:hover {
      background: #0056b3;
    }

    .admin-login,
    .comments-list {
      margin: 20px 0;
    }

    .admin-login input {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border-radius: 5px;
      border: 1px solid var(--container-border);
      background: var(--primary-color);
      color: var(--text-color);
    }

    .admin-login button {
      padding: 10px 20px;
      background: var(--first-color);
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .admin-login button:hover {
      background: #0056b3;
    }

    .comments-list ul {
      list-style: none;
      padding: 0;
    }

    .comment {
      padding: 10px;
      border-bottom: 1px solid var(--container-border);
      margin-bottom: 10px;
    }

    .comment strong {
      display: block;
      margin-bottom: 5px;
    }

    .comment .stars {
      margin: 5px 0;
    }

    .comment .stars li {
      display: inline-block;
      font-size: 1.2em;
      color: #ddd;
    }

    .comment .stars .yellow {
      color: #f1c40f;
    }

    .reply {
      margin-left: 20px;
      font-size: 0.9em;
      color: var(--text-color);
      border-left: 2px solid var(--first-color);
      padding-left: 10px;
    }

    .reply-input {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border-radius: 5px;
      border: 1px solid var(--container-border);
      resize: vertical;
      background: var(--primary-color);
      color: var(--text-color);
    }

    .reply-btn,
    .submit-reply-btn,
    .delete-btn {
      padding: 5px 10px;
      background: var(--first-color);
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 5px;
    }

    .delete-btn {
      background: #ff4d4d;
    }

    .reply-btn:hover,
    .submit-reply-btn:hover {
      background: #0056b3;
    }

    .delete-btn:hover {
      background: #e60000;
    }

    .error {
      color: red;
      text-align: center;
    }

    #theme-toggle img {
      width: 24px;
      height: 24px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Comments Management</h1>
    <div class="nav-links">
      <a href="/admin/index.html">Manage Projects</a>
      <a href="#" id="theme-toggle">
        <img id="modeToggle" class="icon color-icon" src="assets/img/theme_light.png"
          src-light="assets/img/theme_light.png" src-dark="assets/img/theme_dark.png" alt="Color theme icon" />
      </a>
    </div>
    <div class="admin-login" id="admin-login">
      <h3>Admin Login</h3>
      <input type="text" id="admin-username" placeholder="Username">
      <input type="password" id="admin-password" placeholder="Password">
      <button id="login-btn">Login</button>
      <p class="error" id="login-error"></p>
    </div>
    <div class="comments-list" id="comments-list" style="display: none;">
      <h3>Comments</h3>
      <ul id="comments-ul"></ul>
      <p class="error" id="comment-error"></p>
    </div>
  </div>
  <script src="/assets/js/config.js"></script>
  <script>
    const API_URL = window.ENV.API_URL;
let userToken = localStorage.getItem('userToken');

    //  Dark Mode/Light Mode
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      const modeToggle = document.getElementById('modeToggle');
      modeToggle.src = theme === 'dark' ? modeToggle.getAttribute('src-dark') : modeToggle.getAttribute('src-light');
    }

    document.getElementById('theme-toggle').addEventListener('click', (e) => {
      e.preventDefault();
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      setTheme(newTheme);
    });

    window.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('theme') || 'light';
      setTheme(savedTheme);
    });

    async function loginAdmin() {
      const username = document.getElementById('admin-username').value;
      const password = document.getElementById('admin-password').value;
      const errorEl = document.getElementById('login-error');
      try {
        const response = await fetch(`${API_URL}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await response.json();
        if (data.token) {
          userToken = data.token;
          localStorage.setItem('userToken', userToken);
          document.getElementById('admin-login').style.display = 'none';
          document.getElementById('comments-list').style.display = 'block';
          loadComments();
        } else {
          errorEl.textContent = data.error || 'Invalid credentials';
        }
      } catch (error) {
        errorEl.textContent = 'Login failed: ' + error.message;
      }
    }

    async function loadComments() {
      const errorEl = document.createElement('p');
      errorEl.className = 'error';
      document.getElementById('comments-list').prepend(errorEl);
      try {
        // جلب جميع التعليقات
        const commentsResponse = await fetch(`${API_URL}/api/comments`, {
          headers: { 'Authorization': `Bearer ${userToken}` }
        });
        if (!commentsResponse.ok) {
          if (commentsResponse.status === 401 || commentsResponse.status === 403) {
            localStorage.removeItem('userToken');
            document.getElementById('admin-login').style.display = 'block';
            document.getElementById('comments-list').style.display = 'none';
            errorEl.textContent = 'Session expired. Please log in again.';
            return;
          }
          throw new Error('Failed to fetch comments');
        }
        const comments = await commentsResponse.json();

        // جلب جميع المشاريع للحصول على عناوينها
        const projectsResponse = await fetch(`${API_URL}/api/projects`);
        if (!projectsResponse.ok) throw new Error('Failed to fetch projects');
        const projects = await projectsResponse.json();
        const projectMap = new Map(projects.map(p => [p._id.toString(), p.title]));

        const ul = document.getElementById('comments-ul');
        ul.innerHTML = '';
        comments.forEach(comment => {
          const projectTitle = projectMap.get(comment.projectId.toString()) || 'Unknown Project';
          const li = document.createElement('li');
          li.className = 'comment';
          li.innerHTML = `
                <strong>Project: ${projectTitle}</strong>
                <strong>User: ${comment.userId?.username || 'Anonymous'}</strong>
                <div class="stars">
                    ${Array.from({ length: 5 }, (_, i) => `<li class="star ${i < comment.rating ? 'yellow' : ''}">★</li>`).join('')}
                </div>
                <p>${comment.text}</p>
                ${comment.replies.map(reply => `<div class="reply">Admin: ${reply.text} (${new Date(reply.timestamp).toLocaleString()})</div>`).join('')}
                <button class="reply-btn" data-comment-id="${comment._id}" data-project-id="${comment.projectId}">Reply</button>
                <textarea class="reply-input" data-comment-id="${comment._id}" placeholder="Write a reply..." style="display: none;"></textarea>
                <button class="submit-reply-btn" data-comment-id="${comment._id}" data-project-id="${comment.projectId}" style="display: none;">Submit Reply</button>
                <button class="delete-btn" data-comment-id="${comment._id}" data-project-id="${comment.projectId}">Delete</button>
            `;
          ul.appendChild(li);
        });
        errorEl.textContent = '';
      } catch (error) {
        errorEl.textContent = 'Failed to load comments: ' + error.message;
      }
    }

    document.getElementById('login-btn').addEventListener('click', loginAdmin);

    document.getElementById('comments-ul').addEventListener('click', async function (e) {
      const errorEl = document.getElementById('comment-error');
      if (e.target.classList.contains('reply-btn')) {
        const commentId = e.target.getAttribute('data-comment-id');
        const replyInput = document.querySelector(`.reply-input[data-comment-id="${commentId}"]`);
        const submitReplyBtn = document.querySelector(`.submit-reply-btn[data-comment-id="${commentId}"]`);
        replyInput.style.display = 'block';
        submitReplyBtn.style.display = 'block';
      } else if (e.target.classList.contains('submit-reply-btn')) {
        const commentId = e.target.getAttribute('data-comment-id');
        const replyInput = document.querySelector(`.reply-input[data-comment-id="${commentId}"]`);
        const replyText = replyInput.value.trim();
        if (replyText) {
          try {
            const response = await fetch(`${API_URL}/api/comments/${commentId}/reply`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${userToken}`
              },
              body: JSON.stringify({ text: replyText })
            });
            if (!response.ok) {
              if (response.status === 401 || response.status === 403) {
                errorEl.textContent = 'Session expired. Please log in again.';
                document.getElementById('admin-login').style.display = 'block';
                document.getElementById('comments-list').style.display = 'none';
                localStorage.removeItem('userToken');
                userToken = null;
                return;
              }
              throw new Error('Failed to submit reply');
            }
            replyInput.value = '';
            replyInput.style.display = 'none';
            e.target.style.display = 'none';
            loadComments();
            errorEl.textContent = '';
          } catch (error) {
            errorEl.textContent = 'Failed to submit reply: ' + error.message;
          }
        }
      } else if (e.target.classList.contains('delete-btn')) {
        const commentId = e.target.getAttribute('data-comment-id');
        try {
          const response = await fetch(`${API_URL}/api/comments/${commentId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${userToken}` }
          });
          if (!response.ok) {
            if (response.status === 401 || response.status === 403) {
              errorEl.textContent = 'Session expired. Please log in again.';
              document.getElementById('admin-login').style.display = 'block';
              document.getElementById('comments-list').style.display = 'none';
              localStorage.removeItem('userToken');
              userToken = null;
              return;
            }
            throw new Error('Failed to delete comment');
          }
          loadComments();
          errorEl.textContent = '';
        } catch (error) {
          errorEl.textContent = 'Failed to delete comment: ' + error.message;
        }
      }
    });

    window.addEventListener('load', () => {
      if (userToken) {
        document.getElementById('admin-login').style.display = 'none';
        document.getElementById('comments-list').style.display = 'block';
        loadComments();
      }
    });
  </script>
</body>

</html>
