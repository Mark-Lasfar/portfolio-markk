<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

    <!-- Boxicons -->
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.0.5/css/boxicons.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Flag Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@6.6.6/css/flag-icons.min.css">
    <title>Admin Dashboard</title>
    <style>
:root {
    --first-color: #007bff;
    --second-color: #333;
    --primary-color: #fff;
    --primary-color-2: #f4f4f4;
    --container-border: #ccc;
    --text-color: #333;
    --background-color: #fff;
    --border-color: #ccc;
    --input-bg: #fff;
}
[data-theme="dark"] {
    --first-color: #66b0ff;
    --second-color: #ccc;
    --primary-color: #1a1a1a;
    --primary-color-2: #2c2c2c;
    --container-border: #444;
    --text-color: #fff;
    --background-color: #121212;
    --border-color: #666;
    --input-bg: #2c2c2c;
}

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--background-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--primary-color);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .nav-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .nav-links a,
        #theme-toggle {
            padding: 10px 20px;
            background: var(--first-color);
            color: #fff;
            border-radius: 5px;
            text-decoration: none;
            transition: background 0.3s;
        }

        .nav-links a:hover,
        #theme-toggle:hover {
            background: #0056b3;
        }

        #theme-toggle img {
            width: 24px;
            height: 24px;
        }

        .admin-login,
        .project-form,
        .skills-form,
        .projects-list,
        .skills-list,
        .notifications-list {
            margin: 20px 0;
            padding: 20px;
            background: var(--primary-color-2);
            border-radius: 10px;
            border: 1px solid var(--container-border);
        }

        .admin-login h3,
        .project-form h3,
        .skills-form h3,
        .projects-list h3,
        .skills-list h3,
        .notifications-list h3 {
            margin-top: 0;
            color: var(--first-color);
        }

        .admin-login input,
        .project-form input,
        .project-form textarea,
        .project-form select,
        .skills-form input,
        .skills-form select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid var(--container-border);
            background: var(--primary-color);
            color: var(--text-color);
            box-sizing: border-box;
        }

        .project-form select[multiple],
        .skills-form select[multiple] {
            height: 100px;
        }

        .project-form button,
        .admin-login button,
        .skills-form button,
        .delete-btn,
        .edit-btn {
            padding: 10px 20px;
            background: var(--first-color);
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            transition: background 0.3s;
        }

        .project-form button:hover,
        .admin-login button:hover,
        .skills-form button:hover,
        .delete-btn:hover,
        .edit-btn:hover {
            background: #0056b3;
        }

        .projects-list ul,
        .skills-list ul,
        .notifications-list ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .projects-list li,
        .skills-list li,
        .notifications-list li {
            padding: 15px;
            border-bottom: 1px solid var(--container-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s;
        }

        .projects-list li:hover,
        .skills-list li:hover,
        .notifications-list li:hover {
            background: var(--primary-color);
        }

        .error {
            color: red;
            text-align: center;
            margin: 10px 0;
        }

        .skills-list i {
            margin-right: 10px;
            font-size: 1.2em;
        }
    </style>
</head>

<body>
    <div class="container mx-auto p-6 bg-white dark:bg-gray-800 rounded-lg shadow">
        <h1 class="text-2xl font-bold text-center mb-6">Admin Dashboard</h1>
        <div class="flex justify-between mb-6">
            <a href="/admin/comments.html" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">Manage
                Comments</a>
            <a href="#" id="logout-btn" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600">Logout</a>
        </div>
        <div class="admin-login" id="admin-login">
            <h3>Login</h3>
            <input type="text" id="admin-username" placeholder="Username">
            <input type="password" id="admin-password" placeholder="Password">
            <button id="login-btn">Login</button>
            <p class="error" id="login-error"></p>
        </div>
        <hr>
        <div class="project-form" id="project-form" style="display: none;">
            <h3>Add/Edit Project</h3>
            <input type="hidden" id="project-id">
            <input type="text" id="project-title" placeholder="Title">
            <textarea id="project-description" placeholder="Description" rows="4"></textarea>
            <input type="text" id="project-image" placeholder="Image URL">
            <input type="text" id="project-rating" placeholder="Rating (e.g., Rated 4.5 stars by 3425 users)">
            <input type="number" id="project-stars" placeholder="Stars (1-5)" min="1" max="5">
            <select id="project-links" multiple>
                <option value="">Add link (option|value)</option>
            </select>
            <label><input type="checkbox" id="link-private"> Private (Developers Only)</label>
            <button id="add-link-btn">Add Link</button>
            <button id="submit-project">Submit</button>
            <p class="error" id="project-error"></p>
        </div>
        <hr>
        <div class="skills-form" id="skills-form" style="display: none;">
            <h3>Add/Edit Skill</h3>
            <input type="hidden" id="skill-id">
            <input type="text" id="skill-name" placeholder="Skill Name (e.g., HTML5)">
            <input type="number" id="skill-percentage" placeholder="Percentage (0-100)" min="0" max="100">
            <input type="text" id="skill-icon" placeholder="Icon Class (e.g., bx bxl-python, fa-brands fa-python)">
            <p style="font-size: 0.8em;">
                Find icons at:
                <a href="https://boxicons.com/" target="_blank">Boxicons</a>,
                <a href="https://fontawesome.com/icons" target="_blank">Font Awesome</a>,
                <a href="https://flagicons.lipis.dev/" target="_blank">Flag Icons</a>
            </p>
            <button id="submit-skill">Submit</button>
            <p class="error" id="skill-error"></p>
        </div>
        <hr>
<div class="projects-list" id="projects-list" style="display: none;">
    <h3>Main Page Projects</h3>
    <ul id="projects-ul"></ul>
</div>
        <hr>
        <div class="skills-list" id="skills-list" style="display: none;">
            <h3>Skills</h3>
            <ul id="skills-ul"></ul>
        </div>
        <hr>
        <div class="notifications-list" id="notifications-list" style="display: none;">
            <h3>Notifications</h3>
            <ul id="notifications-ul"></ul>
        </div>
    </div>



    <!-- <script src="/assnv.js" type="module"></script> -->
    <script src="/assets/js/config.js"></script>
    <script>
        const API_URL = window.ENV.API_URL;
let userToken = localStorage.getItem('userToken');

        // إعداد Dark Mode/Light Mode
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            const modeToggle = document.getElementById('modeToggle');
            modeToggle.src = theme === 'dark' ? modeToggle.getAttribute('src-dark') : modeToggle.getAttribute('src-light');
        }

        document.getElementById('theme-toggle').addEventListener('click', (e) => {
            e.preventDefault();
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            setTheme(newTheme);
        });

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            setTheme(savedTheme);
            if (userToken) {
                document.getElementById('admin-login').style.display = 'none';
                document.getElementById('project-form').style.display = 'block';
                document.getElementById('projects-list').style.display = 'block';
                document.getElementById('skills-form').style.display = 'block';
                document.getElementById('skills-list').style.display = 'block';
document.getElementById('notifications-list').style.display = 'block'; // تصحيح هنا
                loadProjects();
                loadSkills();
                loadConversations();
            }
        });

        async function loginAdmin() {
            const username = document.getElementById('admin-username').value;
            const password = document.getElementById('admin-password').value;
            const errorEl = document.getElementById('login-error');
            try {
                const response = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (data.token) {
                    userToken = data.token;
                    localStorage.setItem('userToken', userToken);
                    document.getElementById('admin-login').style.display = 'none';
                    document.getElementById('project-form').style.display = 'block';
                    document.getElementById('projects-list').style.display = 'block';
                    document.getElementById('skills-form').style.display = 'block';
                    document.getElementById('skills-list').style.display = 'block';
document.getElementById('notifications-list').style.display = 'block'; // تصحيح هنا
                    errorEl.textContent = '';
                    loadProjects();
                    loadSkills();
                    loadConversations();
                } else {
                    errorEl.textContent = data.error || 'Invalid credentials';
                }
            } catch (error) {
                errorEl.textContent = 'Login failed: ' + error.message;
            }
        }

        async function loadNotifications() {
    const errorEl = document.createElement('p');
    errorEl.className = 'error';
    document.getElementById('notifications-list').prepend(errorEl);
    try {
        const response = await fetch(`${API_URL}/api/notifications`, {
            headers: { 'Authorization': `Bearer ${userToken}` }
        });
        if (response.status === 401 || response.status === 403) {
            errorEl.textContent = 'Session expired. Please log in again.';
            document.getElementById('admin-login').style.display = 'block';
            document.getElementById('project-form').style.display = 'none';
            document.getElementById('projects-list').style.display = 'none';
            document.getElementById('skills-form').style.display = 'none';
            document.getElementById('skills-list').style.display = 'none';
            document.getElementById('notifications-list').style.display = 'none';
            localStorage.removeItem('userToken');
            userToken = null;
            return;
        }
        if (!response.ok) throw new Error('Failed to fetch notifications');
        const notifications = await response.json();
        const ul = document.getElementById('notifications-ul');
        ul.innerHTML = '';
        notifications.forEach((notification, index) => {
            const li = document.createElement('li');
            li.textContent = `Notification ${index + 1}: ${notification}`;
            ul.appendChild(li);
        });
        errorEl.textContent = '';
    } catch (error) {
        errorEl.textContent = 'Failed to load notifications: ' + error.message;
    }
}

        async function loadSkills() {
            const errorEl = document.getElementById('skill-error');
            try {
                const response = await fetch(`${API_URL}/api/skills`, {
                    headers: { 'Authorization': `Bearer ${userToken}` }
                });
                if (!response.ok) throw new Error('Failed to fetch skills');
                const skills = await response.json();
                const ul = document.getElementById('skills-ul');
                ul.innerHTML = '';
                skills.forEach(skill => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                <i class="${skill.icon}"></i> ${skill.name} (${skill.percentage}%)
                <div>
                    <button class="edit-btn" data-id="${skill._id}">Edit</button>
                    <button class="delete-btn" data-id="${skill._id}">Delete</button>
                </div>
            `;
                    ul.appendChild(li);
                });
                errorEl.textContent = '';
            } catch (error) {
                errorEl.textContent = 'Failed to load skills: ' + error.message;
            }
        }

        document.getElementById('submit-skill').addEventListener('click', async function () {
            const id = document.getElementById('skill-id').value;
            const name = document.getElementById('skill-name').value;
            const percentage = parseInt(document.getElementById('skill-percentage').value);
            const icon = document.getElementById('skill-icon').value;
            const errorEl = document.getElementById('skill-error');

            try {
                const method = id ? 'PUT' : 'POST';
                const url = id ? `${API_URL}/api/skills/${id}` : `${API_URL}/api/skills`;
                const response = await fetch(url, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${userToken}`
                    },
                    body: JSON.stringify({ name, percentage, icon })
                });
                if (!response.ok) throw new Error('Failed to save skill');
                document.getElementById('skill-id').value = '';
                document.getElementById('skill-name').value = '';
                document.getElementById('skill-percentage').value = '';
                document.getElementById('skill-icon').value = '';
                errorEl.textContent = '';
                loadSkills();
            } catch (error) {
                errorEl.textContent = 'Failed to save skill: ' + error.message;
            }
        });

        document.getElementById('skills-ul').addEventListener('click', async function (e) {
            const errorEl = document.getElementById('skill-error');
            try {
                if (e.target.classList.contains('edit-btn')) {
                    const id = e.target.getAttribute('data-id');
                    const response = await fetch(`${API_URL}/api/skills`, {
                        headers: { 'Authorization': `Bearer ${userToken}` }
                    });
                    if (!response.ok) throw new Error('Failed to fetch skill');
                    const skills = await response.json();
                    const skill = skills.find(s => s._id === id);
                    document.getElementById('skill-id').value = skill._id;
                    document.getElementById('skill-name').value = skill.name;
                    document.getElementById('skill-percentage').value = skill.percentage;
                    document.getElementById('skill-icon').value = skill.icon;
                    errorEl.textContent = '';
                } else if (e.target.classList.contains('delete-btn')) {
                    const id = e.target.getAttribute('data-id');
                    const response = await fetch(`${API_URL}/api/skills/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${userToken}` }
                    });
                    if (!response.ok) throw new Error('Failed to delete skill');
                    errorEl.textContent = '';
                    loadSkills();
                }
            } catch (error) {
                errorEl.textContent = 'Error: ' + error.message;
            }
        });

        async function loadProjects() {
            const errorEl = document.getElementById('project-error');
            try {
                const response = await fetch(`${API_URL}/api/projects`, {
                    headers: { 'Authorization': `Bearer ${userToken}` }
                });
                if (!response.ok) throw new Error('Failed to fetch projects');
                const projects = await response.json();
                const ul = document.getElementById('projects-ul');
                ul.innerHTML = '';
                projects.forEach(project => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                ${project.title}
                <div>
                    <button class="edit-btn" data-id="${project._id}">Edit</button>
                    <button class="delete-btn" data-id="${project._id}">Delete</button>
                </div>
            `;
                    ul.appendChild(li);
                });
                errorEl.textContent = '';
            } catch (error) {
                errorEl.textContent = 'Failed to load projects: ' + error.message;
            }
        }

        async function loadConversations() {
            const errorEl = document.createElement('p');
            errorEl.className = 'error';
            document.getElementById('conversations-list').prepend(errorEl);
            try {
                const response = await fetch(`${API_URL}/api/conversations/export`, {
                    headers: { 'Authorization': `Bearer ${userToken}` }
                });
                if (response.status === 401 || response.status === 403) {
                    errorEl.textContent = 'Session expired. Please log in again.';
                    document.getElementById('admin-login').style.display = 'block';
                    document.getElementById('project-form').style.display = 'none';
                    document.getElementById('projects-list').style.display = 'none';
                    document.getElementById('skills-form').style.display = 'none';
                    document.getElementById('skills-list').style.display = 'none';
                    document.getElementById('conversations-list').style.display = 'none';
                    localStorage.removeItem('userToken');
                    userToken = null;
                    return;
                }
                if (!response.ok) throw new Error('Failed to fetch conversations');
                const conversationsText = await response.text();
                const conversations = conversationsText.split('\n').map(line => line.split(','));
                const ul = document.getElementById('conversations-ul');
                ul.innerHTML = '';
                conversations.forEach((conv, index) => {
                    const li = document.createElement('li');
                    li.textContent = `Conversation ${index + 1}: ${conv.join(' | ')}`;
                    ul.appendChild(li);
                });
                errorEl.textContent = '';
            } catch (error) {
                errorEl.textContent = 'Failed to load conversations: ' + error.message;
            }
        }

        document.getElementById('login-btn').addEventListener('click', loginAdmin);

        document.getElementById('add-link-btn').addEventListener('click', function () {
            const select = document.getElementById('project-links');
            const isPrivate = document.getElementById('link-private').checked;
            const input = prompt('Enter link (e.g., https://github.com/...)');
            if (input) {
                const optionText = input.includes('github.com') ? 'GitHub' : input.includes('vercel.app') ? 'Vercel' : 'Link';
                const opt = document.createElement('option');
                opt.value = input;
                opt.text = optionText;
                opt.dataset.isPrivate = isPrivate;
                select.appendChild(opt);
            }
        });

        document.getElementById('submit-project').addEventListener('click', async function () {
            const id = document.getElementById('project-id').value;
            const title = document.getElementById('project-title').value;
            const description = document.getElementById('project-description').value;
            const image = document.getElementById('project-image').value;
            const rating = document.getElementById('project-rating').value;
            const stars = parseInt(document.getElementById('project-stars').value);
            const links = Array.from(document.getElementById('project-links').options)
                .filter(opt => opt.value)
                .map(opt => ({
                    option: opt.text,
                    value: opt.value,
                    isPrivate: opt.dataset.isPrivate === 'true'
                }));
            const errorEl = document.getElementById('project-error');

            try {
                const method = id ? 'PUT' : 'POST';
                const url = id ? `${API_URL}/api/projects/${id}` : `${API_URL}/api/projects`;
                const response = await fetch(url, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${userToken}`
                    },
                    body: JSON.stringify({ title, description, image, rating, stars, links })
                });
                if (response.status === 401 || response.status === 403) {
                    errorEl.textContent = 'Session expired. Please log in again.';
                    document.getElementById('admin-login').style.display = 'block';
                    document.getElementById('project-form').style.display = 'none';
                    document.getElementById('projects-list').style.display = 'none';
                    document.getElementById('skills-form').style.display = 'none';
                    document.getElementById('skills-list').style.display = 'none';
                    document.getElementById('conversations-list').style.display = 'none';
                    localStorage.removeItem('userToken');
                    userToken = null;
                    return;
                }
                if (!response.ok) throw new Error('Failed to save project');
                document.getElementById('project-id').value = '';
                document.getElementById('project-title').value = '';
                document.getElementById('project-description').value = '';
                document.getElementById('project-image').value = '';
                document.getElementById('project-rating').value = '';
                document.getElementById('project-stars').value = '';
                document.getElementById('project-links').innerHTML = '<option value="">Add link (option|value)</option>';
                errorEl.textContent = '';
                loadProjects();
            } catch (error) {
                errorEl.textContent = 'Failed to save project: ' + error.message;
            }
        });

        document.getElementById('projects-ul').addEventListener('click', async function (e) {
            const errorEl = document.getElementById('project-error');
            try {
                if (e.target.classList.contains('edit-btn')) {
                    const id = e.target.getAttribute('data-id');
                    const response = await fetch(`${API_URL}/api/projects`, {
                        headers: { 'Authorization': `Bearer ${userToken}` }
                    });
                    if (!response.ok) throw new Error('Failed to fetch project');
                    const projects = await response.json();
                    const project = projects.find(p => p._id === id);
                    document.getElementById('project-id').value = project._id;
                    document.getElementById('project-title').value = project.title;
                    document.getElementById('project-description').value = project.description;
                    document.getElementById('project-image').value = project.image;
                    document.getElementById('project-rating').value = project.rating;
                    document.getElementById('project-stars').value = project.stars;
                    const select = document.getElementById('project-links');
                    select.innerHTML = '<option value="">Add link (option|value)</option>';
                    project.links.forEach(link => {
                        const opt = document.createElement('option');
                        opt.value = link.value;
                        opt.text = link.option;
                        select.appendChild(opt);
                    });
                    errorEl.textContent = '';
                } else if (e.target.classList.contains('delete-btn')) {
                    const id = e.target.getAttribute('data-id');
                    const response = await fetch(`${API_URL}/api/projects/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${userToken}` }
                    });
                    if (!response.ok) throw new Error('Failed to delete project');
                    errorEl.textContent = '';
                    loadProjects();
                }
            } catch (error) {
                errorEl.textContent = 'Error: ' + error.message;
            }
        });

        document.getElementById('logout-btn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('userToken');
            userToken = null;
            window.location.href = '/admin';
        });
    </script>
</body>

</html>
