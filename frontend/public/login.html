<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 dark:bg-gray-900 flex items-center justify-center min-h-screen transition-colors duration-300">
    <div class="container max-w-md bg-white dark:bg-gray-800 p-6 rounded-lg shadow-lg text-center">
        <h1 class="text-2xl font-bold mb-6 text-gray-900 dark:text-white">Login</h1>
        <div class="login-form">
            <input type="email" id="email" placeholder="Email" class="w-full p-3 mb-4 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-white">
            <input type="password" id="password" placeholder="Password" class="w-full p-3 mb-4 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-white">
            <button id="login-btn" class="w-full p-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600">Login</button>
            <p class="error text-red-500 mt-4" id="login-error"></p>
            <p class="text-gray-700 dark:text-gray-300 mt-4">Don't have an account? <a href="/register.html" class="text-blue-500 hover:underline">Register</a></p>
            <button class="oauth-btn google w-full p-3 mt-4 bg-red-600 text-white rounded-lg hover:bg-red-700" onclick="window.location.href=`${window.ENV.API_URL}/auth/google`">Login with Google</button>
            <button class="oauth-btn facebook w-full p-3 mt-4 bg-blue-800 text-white rounded-lg hover:bg-blue-900" onclick="window.location.href=`${window.ENV.API_URL}/auth/facebook`">Login with Facebook</button>
            <button class="oauth-btn github w-full p-3 mt-4 bg-gray-800 text-white rounded-lg hover:bg-gray-900" onclick="window.location.href=`${window.ENV.API_URL}/auth/github`">Login with GitHub</button>
        </div>
    </div>
    <script src="/assets/js/config.js"></script>
    <script>
        const API_URL = window.ENV.API_URL;

        // تسجيل الدخول باستخدام البريد الإلكتروني وكلمة المرور
document.getElementById('login-btn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorEl = document.getElementById('login-error');

    if (!email) {
        errorEl.textContent = 'Please enter an email address.';
        return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        errorEl.textContent = 'Please enter a valid email address.';
        return;
    }
    if (!password) {
        errorEl.textContent = 'Please enter a password.';
        return;
    }

    try {
        const response = await fetch(`${API_URL}/api/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await response.json();
        if (data.token) {
            localStorage.setItem('userToken', data.token);
            window.location.href = '/';
        } else {
            errorEl.textContent = data.error || 'Invalid credentials';
        }
    } catch (error) {
        errorEl.textContent = 'Login failed: ' + error.message;
    }
});

        // التعامل مع إعادة التوجيه بعد OAuth
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const error = urlParams.get('error');
            if (token) {
                localStorage.setItem('userToken', token);
                window.location.href = '/';
            } else if (error) {
                document.getElementById('login-error').textContent = 'OAuth login failed: ' + error;
            } else if (localStorage.getItem('userToken')) {
                // إذا كان هناك توكن بالفعل، أعد التوجيه إلى الصفحة الرئيسية
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
